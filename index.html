<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RNFL</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  html, body, #root { height: 100%; margin: 0; background: #0d0f13; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .marquee { animation: scroll-left 18s linear infinite; }
  @keyframes scroll-left { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .marquee { animation: none; } }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module">
const { useState, useEffect, useCallback, useRef, Fragment } = React;

const BASE = "https://site.api.espn.com/apis/site/v2/sports/football/nfl";

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

/* ---------------------------- ICONS (inline SVG, no external icon lib) ---------------------------- */

function IconHome({ size = 20, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      <path d="M9 22V12h6v10" />
    </svg>
  );
}
function IconCalendar({ size = 20, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" />
      <line x1="16" y1="2" x2="16" y2="6" />
      <line x1="8" y1="2" x2="8" y2="6" />
      <line x1="3" y1="10" x2="21" y2="10" />
    </svg>
  );
}
function IconChevronLeft({ size = 22, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="15 18 9 12 15 6" />
    </svg>
  );
}
function IconWarning({ size = 24, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
      <path d="M12 9v4" />
      <path d="M12 17h.01" />
    </svg>
  );
}
function Spinner({ size = 28 }) {
  return (
    <div
      className="spin rounded-full border-2 border-[#6b7482] border-t-transparent"
      style={{ width: size, height: size }}
    />
  );
}
function IconTrophy({ size = 20, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M8 21h8" />
      <path d="M12 17v4" />
      <path d="M7 4h10v6a5 5 0 0 1-10 0z" />
      <path d="M7 5H4a2 2 0 0 0 0 4h3" />
      <path d="M17 5h3a2 2 0 0 1 0 4h-3" />
    </svg>
  );
}
function IconCopy({ size = 16, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2" />
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
    </svg>
  );
}
function IconCheck({ size = 16, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="20 6 9 17 4 12" />
    </svg>
  );
}
function IconUsers({ size = 18, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
      <circle cx="9" cy="7" r="4" />
      <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
      <path d="M16 3.13a4 4 0 0 1 0 7.75" />
    </svg>
  );
}
function IconLogOut({ size = 16, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <polyline points="16 17 21 12 16 7" />
      <line x1="21" y1="12" x2="9" y2="12" />
    </svg>
  );
}

/* ---------------------------- SHARED ---------------------------- */

function Logo({ src, alt, size = 36 }) {
  const [broken, setBroken] = useState(false);
  if (!src || broken) {
    return (
      <div style={{ width: size, height: size }} className="flex items-center justify-center rounded-md bg-[#1c2129] text-[#4c5563] shrink-0">
        <IconWarning size={size * 0.5} />
      </div>
    );
  }
  return <img src={src} alt={alt} onError={() => setBroken(true)} style={{ width: size, height: size }} className="object-contain shrink-0" />;
}

function LoadingBlock({ label }) {
  return (
    <div className="flex flex-col items-center justify-center gap-3 py-16 text-[#6b7482]">
      <Spinner size={28} />
      <span className="font-[Inter] text-sm tracking-wide">{label}</span>
    </div>
  );
}

function ErrorBlock({ label, onRetry }) {
  return (
    <div className="flex flex-col items-center justify-center gap-3 py-16 text-[#6b7482] px-8 text-center">
      <IconWarning size={28} />
      <span className="font-[Inter] text-sm">{label}</span>
      {onRetry && (
        <button onClick={onRetry} className="mt-1 px-4 py-1.5 rounded-full border border-[#2a313c] text-[#e8ecf1] text-xs font-[Inter] font-medium tracking-wide hover:border-[#F2A93B] transition-colors">
          Try again
        </button>
      )}
    </div>
  );
}

/* ---------------------------- HOME ---------------------------- */

function timeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  return `${days}d ago`;
}

function NewsCard({ article }) {
  const img = article.images?.[0]?.url;
  const href = article.links?.web?.href;
  const [broken, setBroken] = useState(false);
  return (
    <a
      href={href}
      target="_blank"
      rel="noopener noreferrer"
      className="flex gap-3 py-3 border-b border-[#1a1f26] last:border-0 active:opacity-70 transition-opacity"
    >
      {img && !broken ? (
        <img
          src={img}
          alt=""
          onError={() => setBroken(true)}
          className="w-24 h-16 rounded-lg object-cover shrink-0 bg-[#1c2129]"
        />
      ) : (
        <div className="w-24 h-16 rounded-lg bg-[#1c2129] shrink-0 flex items-center justify-center text-[#4c5563]">
          <IconWarning size={18} />
        </div>
      )}
      <div className="flex-1 min-w-0">
        <div
          className="font-[Inter] text-sm font-medium text-[#e8ecf1] leading-snug overflow-hidden"
          style={{ display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical" }}
        >
          {article.headline}
        </div>
        <div className="mt-1 font-[JetBrains_Mono] text-[10px] text-[#6b7482] uppercase tracking-widest">
          {article.byline ? `${article.byline} • ` : ""}
          {timeAgo(article.published)}
        </div>
      </div>
    </a>
  );
}

function Home() {
  const [state, setState] = useState({ status: "loading", events: [] });
  const [news, setNews] = useState({ status: "loading", articles: [] });

  const load = useCallback(() => {
    fetch(`${BASE}/scoreboard`)
      .then((r) => r.json())
      .then((data) => {
        setState({ status: "ok", events: data?.events ?? [] });
      })
      .catch(() => setState((prev) => (prev.status === "ok" ? prev : { status: "error", events: [] })));
  }, []);

  const loadNews = useCallback(() => {
    setNews({ status: "loading", articles: [] });
    fetch(`${BASE}/news?limit=25`)
      .then((r) => {
        if (!r.ok) throw new Error("bad response");
        return r.json();
      })
      .then((d) => setNews({ status: "ok", articles: d?.articles ?? [] }))
      .catch(() => setNews({ status: "error", articles: [] }));
  }, []);

  useEffect(() => {
    load();
    const id = setInterval(load, 60000); // refresh scores every 60s
    return () => clearInterval(id);
  }, [load]);

  useEffect(() => loadNews(), [loadNews]);

  const live = state.events.filter((e) => e.status?.type?.state === "in");

  return (
    <div className="flex flex-col h-full">
      {live.length > 0 && (
        <div className="overflow-hidden border-b border-[#1e242c] bg-[#12151b] py-2">
          <div className="marquee flex gap-8 whitespace-nowrap font-[JetBrains_Mono] text-xs text-[#F2A93B]">
            {[...live, ...live].map((e, i) => {
              const c = e.competitions?.[0]?.competitors ?? [];
              const away = c.find((x) => x.homeAway === "away");
              const home = c.find((x) => x.homeAway === "home");
              return (
                <span key={i} className="flex items-center gap-2">
                  <span className="w-1.5 h-1.5 rounded-full bg-[#FF3D2E] animate-pulse" />
                  {away?.team?.abbreviation} {away?.score}–{home?.score} {home?.team?.abbreviation}
                </span>
              );
            })}
          </div>
        </div>
      )}

      <div className="flex-1 overflow-y-auto">
        <div className="px-5 pt-6 pb-2">
          <h2 className="font-[Teko] text-4xl text-[#e8ecf1] leading-none tracking-wide">League News</h2>
        </div>
        <div className="px-5 pb-8">
          {news.status === "loading" && <LoadingBlock label="Loading headlines…" />}
          {news.status === "error" && <ErrorBlock label="Couldn't load the news feed." onRetry={loadNews} />}
          {news.status === "ok" && news.articles.length === 0 && (
            <div className="text-[#6b7482] font-[Inter] text-sm py-10 text-center">No headlines right now.</div>
          )}
          {news.status === "ok" && news.articles.map((a) => <NewsCard key={a.id} article={a} />)}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------- GAMES ---------------------------- */

function GameDetail({ game, onBack }) {
  const c = game.competitions?.[0]?.competitors ?? [];
  const away = c.find((x) => x.homeAway === "away");
  const home = c.find((x) => x.homeAway === "home");
  const isLive = game.status?.type?.state === "in";
  const isFinal = game.status?.type?.completed;
  const notStarted = game.status?.type?.state === "pre";

  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center gap-2 px-4 pt-5 pb-3">
        <button onClick={onBack} className="p-1 -ml-1 text-[#c3c9d2]">
          <IconChevronLeft size={22} />
        </button>
        <span className="font-[Inter] text-xs uppercase tracking-[0.2em] text-[#6b7482]">{fmtDate(game.date)}</span>
      </div>

      <div className="flex-1 flex flex-col items-center justify-center px-6 -mt-10">
        <div className="w-full flex items-center justify-between mb-2">
          <div className="flex flex-col items-center gap-3 flex-1">
            <Logo src={away?.team?.logo} alt={away?.team?.displayName} size={64} />
            <span className="font-[Inter] text-sm text-[#c3c9d2] text-center">{away?.team?.displayName}</span>
          </div>
          <div className="flex flex-col items-center px-2">
            <div className="font-[Teko] text-6xl text-[#e8ecf1] leading-none flex items-center gap-3">
              <span>{notStarted ? 0 : away?.score ?? 0}</span>
              <span className="text-[#4c5563] text-4xl">–</span>
              <span>{notStarted ? 0 : home?.score ?? 0}</span>
            </div>
            <span className={`mt-2 text-[11px] font-[Inter] font-semibold tracking-widest ${isLive ? "text-[#FF3D2E]" : isFinal ? "text-[#6b7482]" : "text-[#F2A93B]"}`}>
              {isLive ? `LIVE • ${game.status?.type?.shortDetail ?? ""}` : isFinal ? "FINAL" : fmtTime(game.date)}
            </span>
          </div>
          <div className="flex flex-col items-center gap-3 flex-1">
            <Logo src={home?.team?.logo} alt={home?.team?.displayName} size={64} />
            <span className="font-[Inter] text-sm text-[#c3c9d2] text-center">{home?.team?.displayName}</span>
          </div>
        </div>
      </div>

      <div className="px-6 pb-8 text-center">
        <span className="font-[Inter] text-xs text-[#4c5563] tracking-wide">{game.competitions?.[0]?.venue?.fullName ?? ""}</span>
      </div>
    </div>
  );
}

function Games() {
  const [week, setWeek] = useState(1);
  const [defaultWeekSet, setDefaultWeekSet] = useState(false);
  const cache = useRef({});
  const [status, setStatus] = useState("loading");
  const [events, setEvents] = useState([]);
  const [selected, setSelected] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const year = new Date().getFullYear();

  useEffect(() => {
    if (defaultWeekSet) return;
    fetch(`${BASE}/scoreboard`)
      .then((r) => r.json())
      .then((d) => {
        setWeek(d?.week?.number ?? 1);
        setDefaultWeekSet(true);
      })
      .catch(() => setDefaultWeekSet(true));
  }, [defaultWeekSet]);

  const load = useCallback(
    (w, { silent } = {}) => {
      if (!silent) setStatus("loading");
      fetch(`${BASE}/scoreboard?week=${w}&seasontype=2&year=${year}`)
        .then((r) => r.json())
        .then((d) => {
          const ev = d?.events ?? [];
          cache.current[w] = ev;
          setEvents(ev);
          setStatus("ok");
        })
        .catch(() => {
          if (!silent) setStatus("error");
        });
    },
    [year]
  );

  useEffect(() => {
    if (defaultWeekSet) load(week);
  }, [week, defaultWeekSet, load]);

  // refresh the visible week's scores every 60s without showing a loading spinner
  useEffect(() => {
    if (!defaultWeekSet) return;
    const id = setInterval(() => load(week, { silent: true }), 60000);
    return () => clearInterval(id);
  }, [week, defaultWeekSet, load]);

  if (selectedId) {
    const liveGame = events.find((e) => e.id === selectedId) ?? selected;
    return <GameDetail game={liveGame} onBack={() => setSelectedId(null)} />;
  }

  return (
    <div className="flex flex-col h-full">
      <div className="px-5 pt-6 pb-3">
        <h2 className="font-[Teko] text-4xl text-[#e8ecf1] leading-none mb-4">Schedule</h2>
        <div className="flex gap-2 overflow-x-auto pb-1 -mx-5 px-5 no-scrollbar">
          {Array.from({ length: 18 }, (_, i) => i + 1).map((w) => (
            <button
              key={w}
              onClick={() => {
                setWeek(w);
                setSelectedId(null);
              }}
              className={`shrink-0 px-3.5 py-1.5 rounded-full font-[Inter] text-sm font-medium transition-colors ${
                w === week ? "bg-[#F2A93B] text-[#12151b]" : "bg-[#1c2129] text-[#8b93a1] hover:text-[#c3c9d2]"
              }`}
            >
              {w}
            </button>
          ))}
        </div>
      </div>

      <div className="flex-1 overflow-y-auto px-5 pb-6">
        {status === "loading" && <LoadingBlock label={`Loading week ${week}…`} />}
        {status === "error" && <ErrorBlock label="Couldn't load this week's games." onRetry={() => load(week)} />}
        {status === "ok" && events.length === 0 && (
          <div className="text-[#6b7482] font-[Inter] text-sm py-10 text-center">No games scheduled.</div>
        )}
        {status === "ok" &&
          (() => {
            let lastDate = "";
            return events.map((e) => {
              const c = e.competitions?.[0]?.competitors ?? [];
              const away = c.find((x) => x.homeAway === "away");
              const home = c.find((x) => x.homeAway === "home");
              const isLive = e.status?.type?.state === "in";
              const isFinal = e.status?.type?.completed;
              const day = fmtDate(e.date);
              const showHeader = day !== lastDate;
              lastDate = day;
              return (
                <Fragment key={e.id}>
                  {showHeader && (
                    <div className="font-[Inter] text-[11px] uppercase tracking-[0.2em] text-[#4c5563] pt-4 pb-2 first:pt-0">{day}</div>
                  )}
                  <button
                    onClick={() => {
                      setSelected(e);
                      setSelectedId(e.id);
                    }}
                    className="w-full flex items-center justify-between py-3 border-b border-[#1a1f26] active:opacity-70 transition-opacity text-left"
                  >
                    <div className="flex items-center gap-2 flex-1 min-w-0">
                      <Logo src={away?.team?.logo} alt={away?.team?.abbreviation} size={28} />
                      <span className="font-[Inter] text-sm text-[#c3c9d2] truncate">{away?.team?.shortDisplayName}</span>
                    </div>
                    <div className="flex flex-col items-center px-3 shrink-0">
                      {isLive ? (
                        <span className="font-[Teko] text-lg text-[#FF3D2E]">{away?.score}–{home?.score}</span>
                      ) : isFinal ? (
                        <span className="font-[Teko] text-lg text-[#e8ecf1]">{away?.score}–{home?.score}</span>
                      ) : (
                        <span className="font-[JetBrains_Mono] text-[11px] text-[#6b7482]">{fmtTime(e.date)}</span>
                      )}
                    </div>
                    <div className="flex items-center gap-2 flex-1 min-w-0 justify-end">
                      <span className="font-[Inter] text-sm text-[#c3c9d2] truncate text-right">{home?.team?.shortDisplayName}</span>
                      <Logo src={home?.team?.logo} alt={home?.team?.abbreviation} size={28} />
                    </div>
                  </button>
                </Fragment>
              );
            });
          })()}
      </div>
    </div>
  );
}

/* ---------------------------- FANTASY LEAGUE ---------------------------- */
/*
  There's no server of our own here — this is a static page. To let two
  different devices share one league, we lean on kvdb.io, a free public
  key-value storage API built for exactly this (anonymous create/read/write,
  designed to be called directly from browser JS). Each league gets its own
  "bucket"; the bucket ID doubles as the join code. It's not the prettiest
  code, but it's the only way to sync data between devices without asking
  you to stand up your own backend.
*/

const KVDB_ROOT = "https://kvdb.io";
const LS_KEY = "rnfl_fantasy_membership";

function uid() {
  return window.crypto?.randomUUID ? window.crypto.randomUUID() : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}
function readMembership() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}
function writeMembership(obj) {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(obj));
  } catch {}
}
function clearMembership() {
  try {
    localStorage.removeItem(LS_KEY);
  } catch {}
}
function formatCode(id) {
  return (id.match(/.{1,4}/g) || [id]).join("-");
}
function normalizeCode(input) {
  return input.replace(/[\s-]/g, "");
}

async function apiCreateLeague(payload) {
  const bucketRes = await fetch(KVDB_ROOT, {
    method: "POST",
    body: new URLSearchParams({ email: "", default_ttl: "0" }),
  });
  if (!bucketRes.ok) throw new Error(`couldn't set up storage (${bucketRes.status})`);
  const bucketId = (await bucketRes.text()).trim();
  if (!bucketId || bucketId.length > 64) throw new Error("unexpected response");
  const setRes = await fetch(`${KVDB_ROOT}/${bucketId}/data`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!setRes.ok) throw new Error(`couldn't save (${setRes.status})`);
  return { id: bucketId, data: payload };
}
async function apiGetLeague(id) {
  const res = await fetch(`${KVDB_ROOT}/${id}/data`);
  if (res.status === 404) throw new Error("not found");
  if (!res.ok) throw new Error(`couldn't load (${res.status})`);
  const text = await res.text();
  try {
    return JSON.parse(text);
  } catch {
    throw new Error("bad data");
  }
}
async function apiSaveLeague(id, payload) {
  const res = await fetch(`${KVDB_ROOT}/${id}/data`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error(`couldn't save (${res.status})`);
  return payload;
}

function LandingChoice({ onPickCreate, onPickJoin }) {
  return (
    <div className="flex-1 flex flex-col items-center justify-center px-8 gap-4 text-center">
      <IconTrophy size={40} color="#F2A93B" />
      <h2 className="font-[Teko] text-4xl text-[#e8ecf1] leading-none">Fantasy League</h2>
      <p className="font-[Inter] text-sm text-[#6b7482] max-w-xs">
        Start a league on this device and share the code, or join a league someone already started.
      </p>
      <div className="w-full max-w-xs flex flex-col gap-3 mt-2">
        <button onClick={onPickCreate} className="w-full py-3 rounded-xl bg-[#F2A93B] text-[#12151b] font-[Inter] text-sm font-semibold tracking-wide active:scale-[0.98] transition-transform">
          Create a League
        </button>
        <button onClick={onPickJoin} className="w-full py-3 rounded-xl bg-[#1c2129] text-[#e8ecf1] font-[Inter] text-sm font-medium tracking-wide active:scale-[0.98] transition-transform">
          Join a League
        </button>
      </div>
    </div>
  );
}

function CreateLeagueForm({ onBack, onCreated }) {
  const [leagueName, setLeagueName] = useState("");
  const [yourName, setYourName] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  const submit = async () => {
    if (!leagueName.trim() || !yourName.trim()) return;
    setBusy(true);
    setError("");
    try {
      const memberId = uid();
      const payload = {
        name: leagueName.trim().slice(0, 40),
        createdAt: Date.now(),
        members: [{ id: memberId, name: yourName.trim().slice(0, 24), points: 0, joinedAt: Date.now() }],
      };
      const { id, data } = await apiCreateLeague(payload);
      writeMembership({ leagueId: id, memberId, memberName: payload.members[0].name });
      onCreated({ id, data });
    } catch (e) {
      setError(`Couldn't create the league (${e.message}). Check your connection and try again.`);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center gap-2 px-4 pt-5 pb-3">
        <button onClick={onBack} className="p-1 -ml-1 text-[#c3c9d2]">
          <IconChevronLeft size={22} />
        </button>
        <span className="font-[Inter] text-xs uppercase tracking-[0.2em] text-[#6b7482]">New League</span>
      </div>
      <div className="flex-1 px-6 pt-4 flex flex-col gap-4">
        <div>
          <label className="font-[Inter] text-xs text-[#6b7482] tracking-wide">League name</label>
          <input
            value={leagueName}
            onChange={(e) => setLeagueName(e.target.value)}
            placeholder="e.g. Sunday Sweats"
            className="mt-1 w-full bg-[#1c2129] rounded-lg px-3.5 py-3 font-[Inter] text-sm text-[#e8ecf1] placeholder-[#4c5563] outline-none focus:ring-1 focus:ring-[#F2A93B]"
          />
        </div>
        <div>
          <label className="font-[Inter] text-xs text-[#6b7482] tracking-wide">Your name</label>
          <input
            value={yourName}
            onChange={(e) => setYourName(e.target.value)}
            placeholder="e.g. Jordan"
            className="mt-1 w-full bg-[#1c2129] rounded-lg px-3.5 py-3 font-[Inter] text-sm text-[#e8ecf1] placeholder-[#4c5563] outline-none focus:ring-1 focus:ring-[#F2A93B]"
          />
        </div>
        {error && <div className="font-[Inter] text-xs text-[#FF3D2E]">{error}</div>}
        <button
          onClick={submit}
          disabled={busy || !leagueName.trim() || !yourName.trim()}
          className="mt-2 w-full py-3 rounded-xl bg-[#F2A93B] text-[#12151b] font-[Inter] text-sm font-semibold tracking-wide disabled:opacity-40 active:scale-[0.98] transition-transform flex items-center justify-center gap-2"
        >
          {busy ? <Spinner size={16} /> : null}
          {busy ? "Creating…" : "Create League"}
        </button>
      </div>
    </div>
  );
}

function JoinLeagueForm({ onBack, onJoined }) {
  const [code, setCode] = useState("");
  const [yourName, setYourName] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  const submit = async () => {
    const id = normalizeCode(code);
    if (!id || !yourName.trim()) return;
    setBusy(true);
    setError("");
    try {
      const data = await apiGetLeague(id);
      const memberId = uid();
      const member = { id: memberId, name: yourName.trim().slice(0, 24), points: 0, joinedAt: Date.now() };
      const updated = { ...data, members: [...(data.members ?? []), member] };
      await apiSaveLeague(id, updated);
      writeMembership({ leagueId: id, memberId, memberName: member.name });
      onJoined({ id, data: updated });
    } catch (e) {
      if (e.message === "not found") {
        setError("That code doesn't match a league. Double-check and try again.");
      } else {
        setError(`Couldn't reach the league service (${e.message}). Check your connection and try again.`);
      }
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center gap-2 px-4 pt-5 pb-3">
        <button onClick={onBack} className="p-1 -ml-1 text-[#c3c9d2]">
          <IconChevronLeft size={22} />
        </button>
        <span className="font-[Inter] text-xs uppercase tracking-[0.2em] text-[#6b7482]">Join League</span>
      </div>
      <div className="flex-1 px-6 pt-4 flex flex-col gap-4">
        <div>
          <label className="font-[Inter] text-xs text-[#6b7482] tracking-wide">Join code</label>
          <input
            value={code}
            onChange={(e) => setCode(e.target.value)}
            placeholder="e.g. Fd55-uogX-yxYd-nXJv"
            autoCapitalize="none"
            className="mt-1 w-full bg-[#1c2129] rounded-lg px-3.5 py-3 font-[JetBrains_Mono] text-sm tracking-wider text-[#e8ecf1] placeholder-[#4c5563] outline-none focus:ring-1 focus:ring-[#F2A93B]"
          />
        </div>
        <div>
          <label className="font-[Inter] text-xs text-[#6b7482] tracking-wide">Your name</label>
          <input
            value={yourName}
            onChange={(e) => setYourName(e.target.value)}
            placeholder="e.g. Jordan"
            className="mt-1 w-full bg-[#1c2129] rounded-lg px-3.5 py-3 font-[Inter] text-sm text-[#e8ecf1] placeholder-[#4c5563] outline-none focus:ring-1 focus:ring-[#F2A93B]"
          />
        </div>
        {error && <div className="font-[Inter] text-xs text-[#FF3D2E]">{error}</div>}
        <button
          onClick={submit}
          disabled={busy || !code.trim() || !yourName.trim()}
          className="mt-2 w-full py-3 rounded-xl bg-[#F2A93B] text-[#12151b] font-[Inter] text-sm font-semibold tracking-wide disabled:opacity-40 active:scale-[0.98] transition-transform flex items-center justify-center gap-2"
        >
          {busy ? <Spinner size={16} /> : null}
          {busy ? "Joining…" : "Join League"}
        </button>
      </div>
    </div>
  );
}

function LeagueDashboard({ membership, onLeave }) {
  const [status, setStatus] = useState("loading");
  const [league, setLeague] = useState(null);
  const [copied, setCopied] = useState(false);
  const [pointsDraft, setPointsDraft] = useState("");
  const [saving, setSaving] = useState(false);
  const [confirmingLeave, setConfirmingLeave] = useState(false);

  const load = useCallback(
    (silent) => {
      if (!silent) setStatus("loading");
      apiGetLeague(membership.leagueId)
        .then((data) => {
          setLeague(data);
          setStatus("ok");
          const me = (data.members ?? []).find((m) => m.id === membership.memberId);
          setPointsDraft(me ? String(me.points ?? 0) : "0");
        })
        .catch(() => {
          if (!silent) setStatus("error");
        });
    },
    [membership.leagueId, membership.memberId]
  );

  useEffect(() => {
    load(false);
    const id = setInterval(() => load(true), 45000);
    return () => clearInterval(id);
  }, [load]);

  const copyCode = async () => {
    const formatted = formatCode(membership.leagueId);
    try {
      await navigator.clipboard.writeText(formatted);
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    } catch {}
  };

  const share = async () => {
    const formatted = formatCode(membership.leagueId);
    if (navigator.share) {
      try {
        await navigator.share({ title: league?.name ?? "Fantasy League", text: `Join my fantasy league "${league?.name ?? ""}" — code: ${formatted}` });
      } catch {}
    } else {
      copyCode();
    }
  };

  const savePoints = async () => {
    if (!league) return;
    const val = Math.max(0, Math.min(9999, Number(pointsDraft) || 0));
    setSaving(true);
    try {
      const updatedMembers = (league.members ?? []).map((m) => (m.id === membership.memberId ? { ...m, points: val } : m));
      const updated = { ...league, members: updatedMembers };
      await apiSaveLeague(membership.leagueId, updated);
      setLeague(updated);
    } catch {
      // silently ignore; next auto-refresh will resync
    } finally {
      setSaving(false);
    }
  };

  if (status === "loading") {
    return (
      <div className="flex flex-col h-full">
        <LoadingBlock label="Loading your league…" />
      </div>
    );
  }
  if (status === "error") {
    return (
      <div className="flex flex-col h-full">
        <ErrorBlock label="Couldn't reach the league service." onRetry={() => load(false)} />
      </div>
    );
  }

  const members = [...(league.members ?? [])].sort((a, b) => (b.points ?? 0) - (a.points ?? 0));

  return (
    <div className="flex flex-col h-full">
      <div className="flex-1 overflow-y-auto px-5 pt-6 pb-8">
        <h2 className="font-[Teko] text-4xl text-[#e8ecf1] leading-none">{league.name}</h2>
        <div className="mt-1 font-[Inter] text-xs text-[#6b7482] flex items-center gap-1.5">
          <IconUsers size={13} /> {members.length} member{members.length === 1 ? "" : "s"}
        </div>

        <div className="mt-5 rounded-xl bg-[#14181d] p-4">
          <div className="font-[Inter] text-[11px] uppercase tracking-[0.2em] text-[#4c5563] mb-2">Join Code</div>
          <div className="flex items-center gap-2">
            <div className="flex-1 font-[JetBrains_Mono] text-base text-[#F2A93B] tracking-wider break-all">{formatCode(membership.leagueId)}</div>
            <button onClick={copyCode} className="shrink-0 p-2 rounded-lg bg-[#1c2129] text-[#c3c9d2] active:scale-95 transition-transform">
              {copied ? <IconCheck size={16} color="#F2A93B" /> : <IconCopy size={16} />}
            </button>
            {!!navigator.share && (
              <button onClick={share} className="shrink-0 px-3 py-2 rounded-lg bg-[#1c2129] text-[#c3c9d2] font-[Inter] text-xs font-medium active:scale-95 transition-transform">
                Share
              </button>
            )}
          </div>
          <div className="mt-2 font-[Inter] text-[11px] text-[#4c5563]">Share this so others can join from any device.</div>
        </div>

        <div className="mt-6 rounded-xl bg-[#14181d] p-4">
          <div className="font-[Inter] text-[11px] uppercase tracking-[0.2em] text-[#4c5563] mb-2">Your Points</div>
          <div className="flex items-center gap-2">
            <input
              type="number"
              value={pointsDraft}
              onChange={(e) => setPointsDraft(e.target.value)}
              className="w-24 bg-[#1c2129] rounded-lg px-3 py-2 font-[JetBrains_Mono] text-sm text-[#e8ecf1] outline-none focus:ring-1 focus:ring-[#F2A93B]"
            />
            <button
              onClick={savePoints}
              disabled={saving}
              className="px-4 py-2 rounded-lg bg-[#F2A93B] text-[#12151b] font-[Inter] text-xs font-semibold disabled:opacity-40 active:scale-95 transition-transform"
            >
              {saving ? "Saving…" : "Save"}
            </button>
          </div>
        </div>

        <div className="mt-6">
          <div className="font-[Inter] text-[11px] uppercase tracking-[0.2em] text-[#4c5563] mb-2">Leaderboard</div>
          <div className="rounded-xl overflow-hidden bg-[#14181d]">
            {members.map((m, i) => (
              <div
                key={m.id}
                className={`flex items-center gap-3 px-3.5 py-3 ${i !== members.length - 1 ? "border-b border-[#1a1f26]" : ""}`}
              >
                <span className="font-[Teko] text-lg text-[#4c5563] w-5 text-center">{i + 1}</span>
                <span className="font-[Inter] text-sm text-[#e8ecf1] flex-1 truncate">
                  {m.name}
                  {m.id === membership.memberId ? <span className="text-[#F2A93B]"> (you)</span> : null}
                </span>
                <span className="font-[JetBrains_Mono] text-sm text-[#c3c9d2]">{m.points ?? 0}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="mt-8">
          {!confirmingLeave ? (
            <button
              onClick={() => setConfirmingLeave(true)}
              className="w-full py-3 rounded-xl bg-[#1c2129] text-[#8b93a1] font-[Inter] text-sm font-medium tracking-wide flex items-center justify-center gap-2"
            >
              <IconLogOut size={15} /> Leave League
            </button>
          ) : (
            <div className="flex gap-2">
              <button onClick={() => setConfirmingLeave(false)} className="flex-1 py-3 rounded-xl bg-[#1c2129] text-[#c3c9d2] font-[Inter] text-sm font-medium">
                Cancel
              </button>
              <button onClick={onLeave} className="flex-1 py-3 rounded-xl bg-[#FF3D2E] text-[#12151b] font-[Inter] text-sm font-semibold">
                Confirm Leave
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Fantasy() {
  const [membership, setMembership] = useState(() => readMembership());
  const [screen, setScreen] = useState("landing"); // landing | create | join

  if (membership) {
    return (
      <LeagueDashboard
        membership={membership}
        onLeave={() => {
          clearMembership();
          setMembership(null);
          setScreen("landing");
        }}
      />
    );
  }

  if (screen === "create") {
    return (
      <CreateLeagueForm
        onBack={() => setScreen("landing")}
        onCreated={() => setMembership(readMembership())}
      />
    );
  }
  if (screen === "join") {
    return (
      <JoinLeagueForm
        onBack={() => setScreen("landing")}
        onJoined={() => setMembership(readMembership())}
      />
    );
  }
  return <LandingChoice onPickCreate={() => setScreen("create")} onPickJoin={() => setScreen("join")} />;
}
