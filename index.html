<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RNFL</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  html, body, #root { height: 100%; margin: 0; background: #0d0f13; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .marquee { animation: scroll-left 18s linear infinite; }
  @keyframes scroll-left { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .marquee { animation: none; } }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module">
const { useState, useEffect, useCallback, useRef, Fragment } = React;

const BASE = "https://site.api.espn.com/apis/site/v2/sports/football/nfl";

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

/* ---------------------------- ICONS (inline SVG, no external icon lib) ---------------------------- */

function IconHome({ size = 20, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      <path d="M9 22V12h6v10" />
    </svg>
  );
}
function IconCalendar({ size = 20, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" />
      <line x1="16" y1="2" x2="16" y2="6" />
      <line x1="8" y1="2" x2="8" y2="6" />
      <line x1="3" y1="10" x2="21" y2="10" />
    </svg>
  );
}
function IconChevronLeft({ size = 22, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="15 18 9 12 15 6" />
    </svg>
  );
}
function IconWarning({ size = 24, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
      <path d="M12 9v4" />
      <path d="M12 17h.01" />
    </svg>
  );
}
function Spinner({ size = 28 }) {
  return (
    <div
      className="spin rounded-full border-2 border-[#6b7482] border-t-transparent"
      style={{ width: size, height: size }}
    />
  );
}
function IconTrophy({ size = 20, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M8 21h8" />
      <path d="M12 17v4" />
      <path d="M7 4h10v6a5 5 0 0 1-10 0z" />
      <path d="M7 5H4a2 2 0 0 0 0 4h3" />
      <path d="M17 5h3a2 2 0 0 1 0 4h-3" />
    </svg>
  );
}

/* ---------------------------- SHARED ---------------------------- */

function Logo({ src, alt, size = 36 }) {
  const [broken, setBroken] = useState(false);
  if (!src || broken) {
    return (
      <div style={{ width: size, height: size }} className="flex items-center justify-center rounded-md bg-[#1c2129] text-[#4c5563] shrink-0">
        <IconWarning size={size * 0.5} />
      </div>
    );
  }
  return <img src={src} alt={alt} onError={() => setBroken(true)} style={{ width: size, height: size }} className="object-contain shrink-0" />;
}

function LoadingBlock({ label }) {
  return (
    <div className="flex flex-col items-center justify-center gap-3 py-16 text-[#6b7482]">
      <Spinner size={28} />
      <span className="font-[Inter] text-sm tracking-wide">{label}</span>
    </div>
  );
}

function ErrorBlock({ label, onRetry }) {
  return (
    <div className="flex flex-col items-center justify-center gap-3 py-16 text-[#6b7482] px-8 text-center">
      <IconWarning size={28} />
      <span className="font-[Inter] text-sm">{label}</span>
      {onRetry && (
        <button onClick={onRetry} className="mt-1 px-4 py-1.5 rounded-full border border-[#2a313c] text-[#e8ecf1] text-xs font-[Inter] font-medium tracking-wide hover:border-[#F2A93B] transition-colors">
          Try again
        </button>
      )}
    </div>
  );
}

/* ---------------------------- HOME ---------------------------- */

function timeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  return `${days}d ago`;
}

function NewsCard({ article }) {
  const img = article.images?.[0]?.url;
  const href = article.links?.web?.href;
  const [broken, setBroken] = useState(false);
  return (
    <a
      href={href}
      target="_blank"
      rel="noopener noreferrer"
      className="flex gap-3 py-3 border-b border-[#1a1f26] last:border-0 active:opacity-70 transition-opacity"
    >
      {img && !broken ? (
        <img
          src={img}
          alt=""
          onError={() => setBroken(true)}
          className="w-24 h-16 rounded-lg object-cover shrink-0 bg-[#1c2129]"
        />
      ) : (
        <div className="w-24 h-16 rounded-lg bg-[#1c2129] shrink-0 flex items-center justify-center text-[#4c5563]">
          <IconWarning size={18} />
        </div>
      )}
      <div className="flex-1 min-w-0">
        <div
          className="font-[Inter] text-sm font-medium text-[#e8ecf1] leading-snug overflow-hidden"
          style={{ display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical" }}
        >
          {article.headline}
        </div>
        <div className="mt-1 font-[JetBrains_Mono] text-[10px] text-[#6b7482] uppercase tracking-widest">
          {article.byline ? `${article.byline} • ` : ""}
          {timeAgo(article.published)}
        </div>
      </div>
    </a>
  );
}

function Home() {
  const [state, setState] = useState({ status: "loading", events: [] });
  const [news, setNews] = useState({ status: "loading", articles: [] });

  const load = useCallback(() => {
    fetch(`${BASE}/scoreboard`)
      .then((r) => r.json())
      .then((data) => {
        setState({ status: "ok", events: data?.events ?? [] });
      })
      .catch(() => setState((prev) => (prev.status === "ok" ? prev : { status: "error", events: [] })));
  }, []);

  const loadNews = useCallback(() => {
    setNews({ status: "loading", articles: [] });
    fetch(`${BASE}/news?limit=25`)
      .then((r) => {
        if (!r.ok) throw new Error("bad response");
        return r.json();
      })
      .then((d) => setNews({ status: "ok", articles: d?.articles ?? [] }))
      .catch(() => setNews({ status: "error", articles: [] }));
  }, []);

  useEffect(() => {
    load();
    const id = setInterval(load, 60000); // refresh scores every 60s
    return () => clearInterval(id);
  }, [load]);

  useEffect(() => loadNews(), [loadNews]);

  const live = state.events.filter((e) => e.status?.type?.state === "in");

  return (
    <div className="flex flex-col h-full">
      {live.length > 0 && (
        <div className="overflow-hidden border-b border-[#1e242c] bg-[#12151b] py-2">
          <div className="marquee flex gap-8 whitespace-nowrap font-[JetBrains_Mono] text-xs text-[#F2A93B]">
            {[...live, ...live].map((e, i) => {
              const c = e.competitions?.[0]?.competitors ?? [];
              const away = c.find((x) => x.homeAway === "away");
              const home = c.find((x) => x.homeAway === "home");
              return (
                <span key={i} className="flex items-center gap-2">
                  <span className="w-1.5 h-1.5 rounded-full bg-[#FF3D2E] animate-pulse" />
                  {away?.team?.abbreviation} {away?.score}–{home?.score} {home?.team?.abbreviation}
                </span>
              );
            })}
          </div>
        </div>
      )}

      <div className="flex-1 overflow-y-auto">
        <div className="px-5 pt-6 pb-2">
          <h2 className="font-[Teko] text-4xl text-[#e8ecf1] leading-none tracking-wide">League News</h2>
        </div>
        <div className="px-5 pb-8">
          {news.status === "loading" && <LoadingBlock label="Loading headlines…" />}
          {news.status === "error" && <ErrorBlock label="Couldn't load the news feed." onRetry={loadNews} />}
          {news.status === "ok" && news.articles.length === 0 && (
            <div className="text-[#6b7482] font-[Inter] text-sm py-10 text-center">No headlines right now.</div>
          )}
          {news.status === "ok" && news.articles.map((a) => <NewsCard key={a.id} article={a} />)}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------- GAMES ---------------------------- */

function GameDetail({ game, onBack }) {
  const c = game.competitions?.[0]?.competitors ?? [];
  const away = c.find((x) => x.homeAway === "away");
  const home = c.find((x) => x.homeAway === "home");
  const isLive = game.status?.type?.state === "in";
  const isFinal = game.status?.type?.completed;
  const notStarted = game.status?.type?.state === "pre";

  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center gap-2 px-4 pt-5 pb-3">
        <button onClick={onBack} className="p-1 -ml-1 text-[#c3c9d2]">
          <IconChevronLeft size={22} />
        </button>
        <span className="font-[Inter] text-xs uppercase tracking-[0.2em] text-[#6b7482]">{fmtDate(game.date)}</span>
      </div>

      <div className="flex-1 flex flex-col items-center justify-center px-6 -mt-10">
        <div className="w-full flex items-center justify-between mb-2">
          <div className="flex flex-col items-center gap-3 flex-1">
            <Logo src={away?.team?.logo} alt={away?.team?.displayName} size={64} />
            <span className="font-[Inter] text-sm text-[#c3c9d2] text-center">{away?.team?.displayName}</span>
          </div>
          <div className="flex flex-col items-center px-2">
            <div className="font-[Teko] text-6xl text-[#e8ecf1] leading-none flex items-center gap-3">
              <span>{notStarted ? 0 : away?.score ?? 0}</span>
              <span className="text-[#4c5563] text-4xl">–</span>
              <span>{notStarted ? 0 : home?.score ?? 0}</span>
            </div>
            <span className={`mt-2 text-[11px] font-[Inter] font-semibold tracking-widest ${isLive ? "text-[#FF3D2E]" : isFinal ? "text-[#6b7482]" : "text-[#F2A93B]"}`}>
              {isLive ? `LIVE • ${game.status?.type?.shortDetail ?? ""}` : isFinal ? "FINAL" : fmtTime(game.date)}
            </span>
          </div>
          <div className="flex flex-col items-center gap-3 flex-1">
            <Logo src={home?.team?.logo} alt={home?.team?.displayName} size={64} />
            <span className="font-[Inter] text-sm text-[#c3c9d2] text-center">{home?.team?.displayName}</span>
          </div>
        </div>
      </div>

      <div className="px-6 pb-8 text-center">
        <span className="font-[Inter] text-xs text-[#4c5563] tracking-wide">{game.competitions?.[0]?.venue?.fullName ?? ""}</span>
      </div>
    </div>
  );
}

function Games() {
  const [week, setWeek] = useState(1);
  const [defaultWeekSet, setDefaultWeekSet] = useState(false);
  const cache = useRef({});
  const [status, setStatus] = useState("loading");
  const [events, setEvents] = useState([]);
  const [selected, setSelected] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const year = new Date().getFullYear();

  useEffect(() => {
    if (defaultWeekSet) return;
    fetch(`${BASE}/scoreboard`)
      .then((r) => r.json())
      .then((d) => {
        setWeek(d?.week?.number ?? 1);
        setDefaultWeekSet(true);
      })
      .catch(() => setDefaultWeekSet(true));
  }, [defaultWeekSet]);

  const load = useCallback(
    (w, { silent } = {}) => {
      if (!silent) setStatus("loading");
      fetch(`${BASE}/scoreboard?week=${w}&seasontype=2&year=${year}`)
        .then((r) => r.json())
        .then((d) => {
          const ev = d?.events ?? [];
          cache.current[w] = ev;
          setEvents(ev);
          setStatus("ok");
        })
        .catch(() => {
          if (!silent) setStatus("error");
        });
    },
    [year]
  );

  useEffect(() => {
    if (defaultWeekSet) load(week);
  }, [week, defaultWeekSet, load]);

  // refresh the visible week's scores every 60s without showing a loading spinner
  useEffect(() => {
    if (!defaultWeekSet) return;
    const id = setInterval(() => load(week, { silent: true }), 60000);
    return () => clearInterval(id);
  }, [week, defaultWeekSet, load]);

  if (selectedId) {
    const liveGame = events.find((e) => e.id === selectedId) ?? selected;
    return <GameDetail game={liveGame} onBack={() => setSelectedId(null)} />;
  }

  return (
    <div className="flex flex-col h-full">
      <div className="px-5 pt-6 pb-3">
        <h2 className="font-[Teko] text-4xl text-[#e8ecf1] leading-none mb-4">Schedule</h2>
        <div className="flex gap-2 overflow-x-auto pb-1 -mx-5 px-5 no-scrollbar">
          {Array.from({ length: 18 }, (_, i) => i + 1).map((w) => (
            <button
              key={w}
              onClick={() => {
                setWeek(w);
                setSelectedId(null);
              }}
              className={`shrink-0 px-3.5 py-1.5 rounded-full font-[Inter] text-sm font-medium transition-colors ${
                w === week ? "bg-[#F2A93B] text-[#12151b]" : "bg-[#1c2129] text-[#8b93a1] hover:text-[#c3c9d2]"
              }`}
            >
              {w}
            </button>
          ))}
        </div>
      </div>

      <div className="flex-1 overflow-y-auto px-5 pb-6">
        {status === "loading" && <LoadingBlock label={`Loading week ${week}…`} />}
        {status === "error" && <ErrorBlock label="Couldn't load this week's games." onRetry={() => load(week)} />}
        {status === "ok" && events.length === 0 && (
          <div className="text-[#6b7482] font-[Inter] text-sm py-10 text-center">No games scheduled.</div>
        )}
        {status === "ok" &&
          (() => {
            let lastDate = "";
            return events.map((e) => {
              const c = e.competitions?.[0]?.competitors ?? [];
              const away = c.find((x) => x.homeAway === "away");
              const home = c.find((x) => x.homeAway === "home");
              const isLive = e.status?.type?.state === "in";
              const isFinal = e.status?.type?.completed;
              const day = fmtDate(e.date);
              const showHeader = day !== lastDate;
              lastDate = day;
              return (
                <Fragment key={e.id}>
                  {showHeader && (
                    <div className="font-[Inter] text-[11px] uppercase tracking-[0.2em] text-[#4c5563] pt-4 pb-2 first:pt-0">{day}</div>
                  )}
                  <button
                    onClick={() => {
                      setSelected(e);
                      setSelectedId(e.id);
                    }}
                    className="w-full flex items-center justify-between py-3 border-b border-[#1a1f26] active:opacity-70 transition-opacity text-left"
                  >
                    <div className="flex items-center gap-2 flex-1 min-w-0">
                      <Logo src={away?.team?.logo} alt={away?.team?.abbreviation} size={28} />
                      <span className="font-[Inter] text-sm text-[#c3c9d2] truncate">{away?.team?.shortDisplayName}</span>
                    </div>
                    <div className="flex flex-col items-center px-3 shrink-0">
                      {isLive ? (
                        <span className="font-[Teko] text-lg text-[#FF3D2E]">{away?.score}–{home?.score}</span>
                      ) : isFinal ? (
                        <span className="font-[Teko] text-lg text-[#e8ecf1]">{away?.score}–{home?.score}</span>
                      ) : (
                        <span className="font-[JetBrains_Mono] text-[11px] text-[#6b7482]">{fmtTime(e.date)}</span>
                      )}
                    </div>
                    <div className="flex items-center gap-2 flex-1 min-w-0 justify-end">
                      <span className="font-[Inter] text-sm text-[#c3c9d2] truncate text-right">{home?.team?.shortDisplayName}</span>
                      <Logo src={home?.team?.logo} alt={home?.team?.abbreviation} size={28} />
                    </div>
                  </button>
                </Fragment>
              );
            });
          })()}
      </div>
    </div>
  );
}

/* ---------------------------- MY SQUAD ---------------------------- */
/*
  A season-long, single-device fantasy squad. You draft 8 real NFL players
  once; every week, their actual game stats (pulled from ESPN's public box
  scores) turn into fantasy points automatically, building a running season
  total. No accounts, no shared backend, no join codes — just this device's
  browser storage (localStorage) and read-only public stats. Nothing here
  can break the way a shared-database feature can.
*/

const SQUAD_KEY = "rnfl_squad_v1";

const SLOTS = [
  { key: "QB", label: "Quarterback", allowed: ["QB"] },
  { key: "RB1", label: "Running Back", allowed: ["RB"] },
  { key: "RB2", label: "Running Back", allowed: ["RB"] },
  { key: "WR1", label: "Wide Receiver", allowed: ["WR"] },
  { key: "WR2", label: "Wide Receiver", allowed: ["WR"] },
  { key: "WR3", label: "Wide Receiver", allowed: ["WR"] },
  { key: "TE", label: "Tight End", allowed: ["TE"] },
  { key: "FLEX", label: "Flex (RB/WR/TE)", allowed: ["RB", "WR", "TE"] },
];

function readSquad() {
  try {
    const raw = localStorage.getItem(SQUAD_KEY);
    return raw ? JSON.parse(raw) : { roster: {}, log: {} };
  } catch {
    return { roster: {}, log: {} };
  }
}
function writeSquad(data) {
  try {
    localStorage.setItem(SQUAD_KEY, JSON.stringify(data));
  } catch {}
}

// --- scoring (half-PPR style) ---
// Passing: 1 pt / 25 yds, 4 pts / TD, -2 / INT
// Rushing: 1 pt / 10 yds, 6 pts / TD
// Receiving: 1 pt / 10 yds, 6 pts / TD, 0.5 pt / reception
function calcPoints(s) {
  const pass = (s.passYds || 0) / 25 + (s.passTD || 0) * 4 - (s.passINT || 0) * 2;
  const rush = (s.rushYds || 0) / 10 + (s.rushTD || 0) * 6;
  const rec = (s.recYds || 0) / 10 + (s.recTD || 0) * 6 + (s.rec || 0) * 0.5;
  return Math.round((pass + rush + rec) * 10) / 10;
}

function findStatIndex(category, name) {
  const labels = category?.labels || [];
  return labels.findIndex((l) => (l || "").toUpperCase() === name);
}
function numAt(arr, idx) {
  if (idx == null || idx < 0 || !arr) return 0;
  const raw = String(arr[idx] ?? "0").replace(/,/g, "");
  const n = parseFloat(raw);
  return Number.isFinite(n) ? n : 0;
}

// Pull one athlete's stat line out of an ESPN boxscore payload.
function extractStatsFromBoxscore(boxscore, athleteId) {
  const out = { passYds: 0, passTD: 0, passINT: 0, rushYds: 0, rushTD: 0, rec: 0, recYds: 0, recTD: 0, found: false };
  const teams = boxscore?.players || [];
  for (const teamBlock of teams) {
    for (const cat of teamBlock.statistics || []) {
      const name = (cat.name || "").toLowerCase();
      const athlete = (cat.athletes || []).find((a) => String(a?.athlete?.id) === String(athleteId));
      if (!athlete) continue;
      out.found = true;
      const stats = athlete.stats || [];
      if (name === "passing") {
        const ydsIdx = findStatIndex(cat, "YDS");
        const tdIdx = findStatIndex(cat, "TD");
        const intIdx = findStatIndex(cat, "INT");
        out.passYds += numAt(stats, ydsIdx);
        out.passTD += numAt(stats, tdIdx);
        out.passINT += numAt(stats, intIdx);
      } else if (name === "rushing") {
        const ydsIdx = findStatIndex(cat, "YDS");
        const tdIdx = findStatIndex(cat, "TD");
        out.rushYds += numAt(stats, ydsIdx);
        out.rushTD += numAt(stats, tdIdx);
      } else if (name === "receiving") {
        const recIdx = findStatIndex(cat, "REC");
        const ydsIdx = findStatIndex(cat, "YDS");
        const tdIdx = findStatIndex(cat, "TD");
        out.rec += numAt(stats, recIdx);
        out.recYds += numAt(stats, ydsIdx);
        out.recTD += numAt(stats, tdIdx);
      }
    }
  }
  return out;
}

async function findEventForTeam(teamId, week, year) {
  const res = await fetch(`${BASE}/scoreboard?week=${week}&seasontype=2&year=${year}`);
  if (!res.ok) throw new Error("schedule lookup failed");
  const data = await res.json();
  const events = data?.events || [];
  for (const e of events) {
    const competitors = e.competitions?.[0]?.competitors || [];
    if (competitors.some((c) => String(c.team?.id) === String(teamId))) {
      return e;
    }
  }
  return null;
}

/* ---------------------------- PLAYER PICKER ---------------------------- */

function TeamPickerList({ onPick, onBack }) {
  const [status, setStatus] = useState("loading");
  const [teams, setTeams] = useState([]);

  const load = useCallback(() => {
    setStatus("loading");
    fetch(`${BASE}/teams?limit=32`)
      .then((r) => {
        if (!r.ok) throw new Error("bad response");
        return r.json();
      })
      .then((d) => {
        const list = (d?.sports?.[0]?.leagues?.[0]?.teams ?? []).map((t) => t.team);
        setTeams(list.sort((a, b) => a.displayName.localeCompare(b.displayName)));
        setStatus("ok");
      })
      .catch(() => setStatus("error"));
  }, []);
  useEffect(() => load(), [load]);

  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center gap-2 px-4 pt-5 pb-3">
        <button onClick={onBack} className="p-1 -ml-1 text-[#c3c9d2]">
          <IconChevronLeft size={22} />
        </button>
        <span className="font-[Inter] text-xs uppercase tracking-[0.2em] text-[#6b7482]">Choose a Team</span>
      </div>
      <div className="flex-1 overflow-y-auto px-5 pb-6">
        {status === "loading" && <LoadingBlock label="Loading teams…" />}
        {status === "error" && <ErrorBlock label="Couldn't load teams." onRetry={load} />}
        {status === "ok" && (
          <div className="rounded-xl overflow-hidden bg-[#14181d]">
            {teams.map((t, i) => (
              <button
                key={t.id}
                onClick={() => onPick(t)}
                className={`w-full flex items-center gap-3 px-3.5 py-3 text-left active:bg-[#1c2129] transition-colors ${
                  i !== teams.length - 1 ? "border-b border-[#1a1f26]" : ""
                }`}
              >
                <Logo src={t.logos?.[0]?.href} alt={t.displayName} size={28} />
                <span className="font-[Inter] text-sm text-[#e8ecf1]">{t.displayName}</span>
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function Headshot({ src, alt, name, size = 44 }) {
  const [broken, setBroken] = useState(false);
  const initials = (name || "?").split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  if (!src || broken) {
    return (
      <div
        style={{ width: size, height: size }}
        className="rounded-lg bg-[#1c2129] flex items-center justify-center text-[#5a6472] font-[Teko] text-lg shrink-0"
      >
        {initials || "?"}
      </div>
    );
  }
  return (
    <img
      src={src}
      alt={alt}
      onError={() => setBroken(true)}
      style={{ width: size, height: size }}
      className="rounded-lg object-cover bg-[#1c2129] shrink-0"
    />
  );
}

function PlayerPickerList({ team, allowedPositions, onPick, onBack }) {
  const [status, setStatus] = useState("loading");
  const [players, setPlayers] = useState([]);

  const load = useCallback(() => {
    setStatus("loading");
    fetch(`${BASE}/teams/${team.id}/roster`)
      .then((r) => {
        if (!r.ok) throw new Error("bad response");
        return r.json();
      })
      .then((d) => {
        const groups = d?.athletes ?? [];
        const flat = [];
        groups.forEach((g) => (g.items || []).forEach((p) => flat.push(p)));
        const filtered = flat.filter((p) => allowedPositions.includes(p.position?.abbreviation));
        setPlayers(filtered);
        setStatus("ok");
      })
      .catch(() => setStatus("error"));
  }, [team.id, allowedPositions]);
  useEffect(() => load(), [load]);

  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center gap-3 px-4 pt-5 pb-3">
        <button onClick={onBack} className="p-1 -ml-1 text-[#c3c9d2]">
          <IconChevronLeft size={22} />
        </button>
        <Logo src={team.logos?.[0]?.href} alt={team.displayName} size={24} />
        <span className="font-[Inter] text-xs uppercase tracking-[0.2em] text-[#6b7482]">{team.shortDisplayName}</span>
      </div>
      <div className="flex-1 overflow-y-auto px-5 pb-6">
        {status === "loading" && <LoadingBlock label="Loading roster…" />}
        {status === "error" && <ErrorBlock label="Couldn't load this roster." onRetry={load} />}
        {status === "ok" && players.length === 0 && (
          <div className="text-[#6b7482] font-[Inter] text-sm py-10 text-center">
            No eligible players found on this roster.
          </div>
        )}
        {status === "ok" && players.length > 0 && (
          <div className="grid grid-cols-1 gap-2">
            {players.map((p) => (
              <button
                key={p.id}
                onClick={() =>
                  onPick({
                    id: p.id,
                    fullName: p.fullName,
                    teamId: team.id,
                    teamAbbr: team.abbreviation,
                    teamLogo: team.logos?.[0]?.href,
                    position: p.position?.abbreviation,
                    headshot: p.headshot?.href,
                    jersey: p.jersey,
                  })
                }
                className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-[#14181d] active:bg-[#1c2129] transition-colors text-left"
              >
                <Headshot src={p.headshot?.href} alt={p.fullName} name={p.fullName} size={40} />
                <div className="flex-1 min-w-0">
                  <div className="font-[Inter] text-sm text-[#e8ecf1] truncate">{p.fullName}</div>
                  <div className="font-[JetBrains_Mono] text-[10px] text-[#6b7482]">
                    {p.position?.abbreviation} {p.jersey ? `#${p.jersey}` : ""}
                  </div>
                </div>
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function PlayerPickerFlow({ slot, onDone, onCancel }) {
  const [team, setTeam] = useState(null);
  if (!team) return <TeamPickerList onPick={setTeam} onBack={onCancel} />;
  return (
    <PlayerPickerList
      team={team}
      allowedPositions={slot.allowed}
      onPick={onDone}
      onBack={() => setTeam(null)}
    />
  );
}

/* ---------------------------- SQUAD DASHBOARD ---------------------------- */

function SquadDashboard() {
  const [squad, setSquad] = useState(() => readSquad());
  const [pickingSlot, setPickingSlot] = useState(null);
  const [week, setWeek] = useState(null);
  const [calcStatus, setCalcStatus] = useState("idle"); // idle | working | error
  const [calcError, setCalcError] = useState("");
  const [expandedWeek, setExpandedWeek] = useState(null);

  useEffect(() => {
    fetch(`${BASE}/scoreboard`)
      .then((r) => r.json())
      .then((d) => setWeek(d?.week?.number ?? 1))
      .catch(() => setWeek(1));
  }, []);

  const savePlayerToSlot = (slotKey, player) => {
    const next = { ...squad, roster: { ...squad.roster, [slotKey]: player } };
    setSquad(next);
    writeSquad(next);
    setPickingSlot(null);
  };

  const clearSlot = (slotKey) => {
    const nextRoster = { ...squad.roster };
    delete nextRoster[slotKey];
    const next = { ...squad, roster: nextRoster };
    setSquad(next);
    writeSquad(next);
  };

  const filledCount = Object.keys(squad.roster).length;
  const year = new Date().getFullYear();

  const calculateWeek = async () => {
    if (!week) return;
    setCalcStatus("working");
    setCalcError("");
    try {
      const boxCache = {};
      const results = [];
      for (const slot of SLOTS) {
        const player = squad.roster[slot.key];
        if (!player) continue;
        const event = await findEventForTeam(player.teamId, week, year);
        if (!event) {
          results.push({ slotKey: slot.key, name: player.fullName, points: 0, note: "No game this week" });
          continue;
        }
        const isFinalOrLive = event.status?.type?.state === "post" || event.status?.type?.state === "in";
        if (!isFinalOrLive) {
          results.push({ slotKey: slot.key, name: player.fullName, points: 0, note: "Hasn't played yet" });
          continue;
        }
        if (!boxCache[event.id]) {
          const res = await fetch(`${BASE}/summary?event=${event.id}`);
          boxCache[event.id] = res.ok ? await res.json() : null;
        }
        const box = boxCache[event.id];
        if (!box?.boxscore) {
          results.push({ slotKey: slot.key, name: player.fullName, points: 0, note: "Stats unavailable" });
          continue;
        }
        const stats = extractStatsFromBoxscore(box.boxscore, player.id);
        if (!stats.found) {
          results.push({ slotKey: slot.key, name: player.fullName, points: 0, note: "Didn't record stats" });
          continue;
        }
        const pts = calcPoints(stats);
        const bits = [];
        if (stats.passYds || stats.passTD || stats.passINT) bits.push(`${stats.passYds} pass yds, ${stats.passTD} TD, ${stats.passINT} INT`);
        if (stats.rushYds || stats.rushTD) bits.push(`${stats.rushYds} rush yds, ${stats.rushTD} TD`);
        if (stats.rec || stats.recYds || stats.recTD) bits.push(`${stats.rec} rec, ${stats.recYds} yds, ${stats.recTD} TD`);
        results.push({ slotKey: slot.key, name: player.fullName, points: pts, note: bits.join(" · ") || "No stats" });
      }
      const total = Math.round(results.reduce((s, r) => s + r.points, 0) * 10) / 10;
      const next = {
        ...squad,
        log: { ...squad.log, [week]: { total, players: results, computedAt: Date.now() } },
      };
      setSquad(next);
      writeSquad(next);
      setCalcStatus("idle");
    } catch (e) {
      setCalcStatus("error");
      setCalcError(e.message || "Something went wrong");
    }
  };

  const seasonTotal = Math.round(Object.values(squad.log).reduce((s, w) => s + (w.total || 0), 0) * 10) / 10;
  const weekNumbers = Object.keys(squad.log).map(Number).sort((a, b) => b - a);

  if (pickingSlot) {
    const slot = SLOTS.find((s) => s.key === pickingSlot);
    return (
      <PlayerPickerFlow
        slot={slot}
        onCancel={() => setPickingSlot(null)}
        onDone={(player) => savePlayerToSlot(slot.key, player)}
      />
    );
  }

  return (
    <div className="flex flex-col h-full">
      <div className="flex-1 overflow-y-auto px-5 pt-6 pb-8">
        <div className="flex items-center justify-between">
          <h2 className="font-[Teko] text-4xl text-[#e8ecf1] leading-none">My Squad</h2>
          <div className="flex items-center gap-1.5 text-[#F2A93B]">
            <IconTrophy size={16} />
            <span className="font-[JetBrains_Mono] text-sm">{seasonTotal}</span>
          </div>
        </div>
        <div className="mt-1 font-[Inter] text-xs text-[#6b7482]">Season total · {filledCount}/8 roster spots filled</div>

        <div className="mt-5 grid grid-cols-2 gap-2.5">
          {SLOTS.map((slot) => {
            const p = squad.roster[slot.key];
            return (
              <div key={slot.key} className="rounded-xl bg-[#14181d] p-2.5 flex flex-col gap-2">
                <div className="font-[Inter] text-[10px] uppercase tracking-[0.15em] text-[#4c5563]">{slot.label}</div>
                {p ? (
                  <div className="flex items-center gap-2">
                    <Headshot src={p.headshot} alt={p.fullName} name={p.fullName} size={36} />
                    <div className="flex-1 min-w-0">
                      <div className="font-[Inter] text-xs text-[#e8ecf1] truncate">{p.fullName}</div>
                      <div className="font-[JetBrains_Mono] text-[10px] text-[#6b7482]">{p.teamAbbr}</div>
                    </div>
                  </div>
                ) : (
                  <div className="text-[#4c5563] font-[Inter] text-xs">Empty</div>
                )}
                <div className="flex gap-1.5">
                  <button
                    onClick={() => setPickingSlot(slot.key)}
                    className="flex-1 py-1.5 rounded-lg bg-[#1c2129] text-[#c3c9d2] font-[Inter] text-[11px] font-medium active:scale-95 transition-transform"
                  >
                    {p ? "Swap" : "Add"}
                  </button>
                  {p && (
                    <button
                      onClick={() => clearSlot(slot.key)}
                      className="px-2.5 py-1.5 rounded-lg bg-[#1c2129] text-[#6b7482] font-[Inter] text-[11px] active:scale-95 transition-transform"
                    >
                      ✕
                    </button>
                  )}
                </div>
              </div>
            );
          })}
        </div>

        <div className="mt-6">
          <button
            onClick={calculateWeek}
            disabled={calcStatus === "working" || filledCount === 0 || !week}
            className="w-full py-3.5 rounded-xl bg-[#F2A93B] text-[#12151b] font-[Inter] text-sm font-semibold tracking-wide disabled:opacity-40 active:scale-[0.98] transition-transform flex items-center justify-center gap-2"
          >
            {calcStatus === "working" ? <Spinner size={16} /> : null}
            {calcStatus === "working" ? "Calculating…" : `Calculate Week ${week ?? ""} Score`}
          </button>
          {calcStatus === "error" && (
            <div className="mt-2 font-[Inter] text-xs text-[#FF3D2E] text-center">{calcError}</div>
          )}
          <div className="mt-2 font-[Inter] text-[11px] text-[#4c5563] text-center">
            Half-PPR scoring · works once games are live or final
          </div>
        </div>

        {weekNumbers.length > 0 && (
          <div className="mt-7">
            <div className="font-[Inter] text-[11px] uppercase tracking-[0.2em] text-[#4c5563] mb-2">Season Log</div>
            <div className="rounded-xl overflow-hidden bg-[#14181d]">
              {weekNumbers.map((w, i) => {
                const entry = squad.log[w];
                const isOpen = expandedWeek === w;
                return (
                  <div key={w} className={i !== weekNumbers.length - 1 ? "border-b border-[#1a1f26]" : ""}>
                    <button
                      onClick={() => setExpandedWeek(isOpen ? null : w)}
                      className="w-full flex items-center justify-between px-3.5 py-3 active:bg-[#1c2129] transition-colors"
                    >
                      <span className="font-[Inter] text-sm text-[#e8ecf1]">Week {w}</span>
                      <span className="font-[Teko] text-lg text-[#F2A93B]">{entry.total} pts</span>
                    </button>
                    {isOpen && (
                      <div className="px-3.5 pb-3 flex flex-col gap-1.5">
                        {entry.players.map((pl) => (
                          <div key={pl.slotKey} className="flex items-center justify-between gap-2">
                            <div className="min-w-0">
                              <div className="font-[Inter] text-xs text-[#c3c9d2] truncate">{pl.name}</div>
                              <div className="font-[Inter] text-[10px] text-[#4c5563] truncate">{pl.note}</div>
                            </div>
                            <span className="font-[JetBrains_Mono] text-xs text-[#e8ecf1] shrink-0">{pl.points}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

  return (
    <div className="w-full h-[100dvh] max-w-md mx-auto bg-[#0d0f13] flex flex-col overflow-hidden relative">
      <div className="flex items-center justify-between px-5 pt-5 pb-2 border-b border-[#1a1f26]">
        <div className="flex items-center gap-2">
          <span className="w-2 h-2 rounded-full bg-[#FF3D2E]" />
          <h1 className="font-[Teko] text-2xl tracking-[0.08em] text-[#e8ecf1]">RNFL</h1>
        </div>
        <span className="font-[JetBrains_Mono] text-[10px] text-[#4c5563] uppercase tracking-widest">{new Date().getFullYear()} Season</span>
      </div>

      <div className="flex-1 min-h-0">
        {tab === "home" && <Home />}
        {tab === "games" && <Games />}
        {tab === "squad" && <SquadDashboard />}
      </div>

      <div className="flex items-stretch border-t border-[#1a1f26] bg-[#0d0f13]">

          { key: "home", label: "Home", Icon: IconHome },
