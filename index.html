<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RNFL</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  html, body, #root { height: 100%; margin: 0; background: #0d0f13; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .marquee { animation: scroll-left 18s linear infinite; }
  @keyframes scroll-left { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .marquee { animation: none; } }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module">
const { useState, useEffect, useCallback, useRef, Fragment } = React;

const BASE = "https://site.api.espn.com/apis/site/v2/sports/football/nfl";

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

/* ---------------------------- ICONS (inline SVG, no external icon lib) ---------------------------- */

function IconHome({ size = 20, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      <path d="M9 22V12h6v10" />
    </svg>
  );
}
function IconCalendar({ size = 20, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" />
      <line x1="16" y1="2" x2="16" y2="6" />
      <line x1="8" y1="2" x2="8" y2="6" />
      <line x1="3" y1="10" x2="21" y2="10" />
    </svg>
  );
}
function IconChevronLeft({ size = 22, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="15 18 9 12 15 6" />
    </svg>
  );
}
function IconWarning({ size = 24, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
      <path d="M12 9v4" />
      <path d="M12 17h.01" />
    </svg>
  );
}
function Spinner({ size = 28 }) {
  return (
    <div
      className="spin rounded-full border-2 border-[#6b7482] border-t-transparent"
      style={{ width: size, height: size }}
    />
  );
}
function IconTrophy({ size = 20, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M8 21h8" />
      <path d="M12 17v4" />
      <path d="M7 4h10v6a5 5 0 0 1-10 0z" />
      <path d="M7 5H4a2 2 0 0 0 0 4h3" />
      <path d="M17 5h3a2 2 0 0 1 0 4h-3" />
    </svg>
  );
}

/* ---------------------------- SHARED ---------------------------- */

function Logo({ src, alt, size = 36 }) {
  const [broken, setBroken] = useState(false);
  if (!src || broken) {
    return (
      <div style={{ width: size, height: size }} className="flex items-center justify-center rounded-md bg-[#1c2129] text-[#4c5563] shrink-0">
        <IconWarning size={size * 0.5} />
      </div>
    );
  }
  return <img src={src} alt={alt} onError={() => setBroken(true)} style={{ width: size, height: size }} className="object-contain shrink-0" />;
}

function LoadingBlock({ label }) {
  return (
    <div className="flex flex-col items-center justify-center gap-3 py-16 text-[#6b7482]">
      <Spinner size={28} />
      <span className="font-[Inter] text-sm tracking-wide">{label}</span>
    </div>
  );
}

function ErrorBlock({ label, onRetry }) {
  return (
    <div className="flex flex-col items-center justify-center gap-3 py-16 text-[#6b7482] px-8 text-center">
      <IconWarning size={28} />
      <span className="font-[Inter] text-sm">{label}</span>
      {onRetry && (
        <button onClick={onRetry} className="mt-1 px-4 py-1.5 rounded-full border border-[#2a313c] text-[#e8ecf1] text-xs font-[Inter] font-medium tracking-wide hover:border-[#F2A93B] transition-colors">
          Try again
        </button>
      )}
    </div>
  );
}

/* ---------------------------- HOME ---------------------------- */

function timeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  return `${days}d ago`;
}

function NewsCard({ article }) {
  const img = article.images?.[0]?.url;
  const href = article.links?.web?.href;
  const [broken, setBroken] = useState(false);
  return (
    <a
      href={href}
      target="_blank"
      rel="noopener noreferrer"
      className="flex gap-3 py-3 border-b border-[#1a1f26] last:border-0 active:opacity-70 transition-opacity"
    >
      {img && !broken ? (
        <img
          src={img}
          alt=""
          onError={() => setBroken(true)}
          className="w-24 h-16 rounded-lg object-cover shrink-0 bg-[#1c2129]"
        />
      ) : (
        <div className="w-24 h-16 rounded-lg bg-[#1c2129] shrink-0 flex items-center justify-center text-[#4c5563]">
          <IconWarning size={18} />
        </div>
      )}
      <div className="flex-1 min-w-0">
        <div
          className="font-[Inter] text-sm font-medium text-[#e8ecf1] leading-snug overflow-hidden"
          style={{ display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical" }}
        >
          {article.headline}
        </div>
        <div className="mt-1 font-[JetBrains_Mono] text-[10px] text-[#6b7482] uppercase tracking-widest">
          {article.byline ? `${article.byline} • ` : ""}
          {timeAgo(article.published)}
        </div>
      </div>
    </a>
  );
}

function Home() {
  const [state, setState] = useState({ status: "loading", events: [] });
  const [news, setNews] = useState({ status: "loading", articles: [] });

  const load = useCallback(() => {
    fetch(`${BASE}/scoreboard`)
      .then((r) => r.json())
      .then((data) => {
        setState({ status: "ok", events: data?.events ?? [] });
      })
      .catch(() => setState((prev) => (prev.status === "ok" ? prev : { status: "error", events: [] })));
  }, []);

  const loadNews = useCallback(() => {
    setNews({ status: "loading", articles: [] });
    fetch(`${BASE}/news?limit=25`)
      .then((r) => {
        if (!r.ok) throw new Error("bad response");
        return r.json();
      })
      .then((d) => setNews({ status: "ok", articles: d?.articles ?? [] }))
      .catch(() => setNews({ status: "error", articles: [] }));
  }, []);

  useEffect(() => {
    load();
    const id = setInterval(load, 60000); // refresh scores every 60s
    return () => clearInterval(id);
  }, [load]);

  useEffect(() => loadNews(), [loadNews]);

  const live = state.events.filter((e) => e.status?.type?.state === "in");

  return (
    <div className="flex flex-col h-full">
      {live.length > 0 && (
        <div className="overflow-hidden border-b border-[#1e242c] bg-[#12151b] py-2">
          <div className="marquee flex gap-8 whitespace-nowrap font-[JetBrains_Mono] text-xs text-[#F2A93B]">
            {[...live, ...live].map((e, i) => {
              const c = e.competitions?.[0]?.competitors ?? [];
              const away = c.find((x) => x.homeAway === "away");
              const home = c.find((x) => x.homeAway === "home");
              return (
                <span key={i} className="flex items-center gap-2">
                  <span className="w-1.5 h-1.5 rounded-full bg-[#FF3D2E] animate-pulse" />
                  {away?.team?.abbreviation} {away?.score}–{home?.score} {home?.team?.abbreviation}
                </span>
              );
            })}
          </div>
        </div>
      )}

      <div className="flex-1 overflow-y-auto">
        <div className="px-5 pt-6 pb-2">
          <h2 className="font-[Teko] text-4xl text-[#e8ecf1] leading-none tracking-wide">League News</h2>
        </div>
        <div className="px-5 pb-8">
          {news.status === "loading" && <LoadingBlock label="Loading headlines…" />}
          {news.status === "error" && <ErrorBlock label="Couldn't load the news feed." onRetry={loadNews} />}
          {news.status === "ok" && news.articles.length === 0 && (
            <div className="text-[#6b7482] font-[Inter] text-sm py-10 text-center">No headlines right now.</div>
          )}
          {news.status === "ok" && news.articles.map((a) => <NewsCard key={a.id} article={a} />)}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------- GAMES ---------------------------- */

function GameDetail({ game, onBack }) {
  const c = game.competitions?.[0]?.competitors ?? [];
  const away = c.find((x) => x.homeAway === "away");
  const home = c.find((x) => x.homeAway === "home");
  const isLive = game.status?.type?.state === "in";
  const isFinal = game.status?.type?.completed;
  const notStarted = game.status?.type?.state === "pre";

  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center gap-2 px-4 pt-5 pb-3">
        <button onClick={onBack} className="p-1 -ml-1 text-[#c3c9d2]">
          <IconChevronLeft size={22} />
        </button>
        <span className="font-[Inter] text-xs uppercase tracking-[0.2em] text-[#6b7482]">{fmtDate(game.date)}</span>
      </div>

      <div className="flex-1 flex flex-col items-center justify-center px-6 -mt-10">
        <div className="w-full flex items-center justify-between mb-2">
          <div className="flex flex-col items-center gap-3 flex-1">
            <Logo src={away?.team?.logo} alt={away?.team?.displayName} size={64} />
            <span className="font-[Inter] text-sm text-[#c3c9d2] text-center">{away?.team?.displayName}</span>
          </div>
          <div className="flex flex-col items-center px-2">
            <div className="font-[Teko] text-6xl text-[#e8ecf1] leading-none flex items-center gap-3">
              <span>{notStarted ? 0 : away?.score ?? 0}</span>
              <span className="text-[#4c5563] text-4xl">–</span>
              <span>{notStarted ? 0 : home?.score ?? 0}</span>
            </div>
            <span className={`mt-2 text-[11px] font-[Inter] font-semibold tracking-widest ${isLive ? "text-[#FF3D2E]" : isFinal ? "text-[#6b7482]" : "text-[#F2A93B]"}`}>
              {isLive ? `LIVE • ${game.status?.type?.shortDetail ?? ""}` : isFinal ? "FINAL" : fmtTime(game.date)}
            </span>
          </div>
          <div className="flex flex-col items-center gap-3 flex-1">
            <Logo src={home?.team?.logo} alt={home?.team?.displayName} size={64} />
            <span className="font-[Inter] text-sm text-[#c3c9d2] text-center">{home?.team?.displayName}</span>
          </div>
        </div>
      </div>

      <div className="px-6 pb-8 text-center">
        <span className="font-[Inter] text-xs text-[#4c5563] tracking-wide">{game.competitions?.[0]?.venue?.fullName ?? ""}</span>
      </div>
    </div>
  );
}

function Games() {
  const [week, setWeek] = useState(1);
  const [defaultWeekSet, setDefaultWeekSet] = useState(false);
  const cache = useRef({});
  const [status, setStatus] = useState("loading");
  const [events, setEvents] = useState([]);
  const [selected, setSelected] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const year = new Date().getFullYear();

  useEffect(() => {
    if (defaultWeekSet) return;
    fetch(`${BASE}/scoreboard`)
      .then((r) => r.json())
      .then((d) => {
        setWeek(d?.week?.number ?? 1);
        setDefaultWeekSet(true);
      })
      .catch(() => setDefaultWeekSet(true));
  }, [defaultWeekSet]);

  const load = useCallback(
    (w, { silent } = {}) => {
      if (!silent) setStatus("loading");
      fetch(`${BASE}/scoreboard?week=${w}&seasontype=2&year=${year}`)
        .then((r) => r.json())
        .then((d) => {
          const ev = d?.events ?? [];
          cache.current[w] = ev;
          setEvents(ev);
          setStatus("ok");
        })
        .catch(() => {
          if (!silent) setStatus("error");
        });
    },
    [year]
  );

  useEffect(() => {
    if (defaultWeekSet) load(week);
  }, [week, defaultWeekSet, load]);

  // refresh the visible week's scores every 60s without showing a loading spinner
  useEffect(() => {
    if (!defaultWeekSet) return;
    const id = setInterval(() => load(week, { silent: true }), 60000);
    return () => clearInterval(id);
  }, [week, defaultWeekSet, load]);

  if (selectedId) {
    const liveGame = events.find((e) => e.id === selectedId) ?? selected;
    return <GameDetail game={liveGame} onBack={() => setSelectedId(null)} />;
  }

  return (
    <div className="flex flex-col h-full">
      <div className="px-5 pt-6 pb-3">
        <h2 className="font-[Teko] text-4xl text-[#e8ecf1] leading-none mb-4">Schedule</h2>
        <div className="flex gap-2 overflow-x-auto pb-1 -mx-5 px-5 no-scrollbar">
          {Array.from({ length: 18 }, (_, i) => i + 1).map((w) => (
            <button
              key={w}
              onClick={() => {
                setWeek(w);
                setSelectedId(null);
              }}
              className={`shrink-0 px-3.5 py-1.5 rounded-full font-[Inter] text-sm font-medium transition-colors ${
                w === week ? "bg-[#F2A93B] text-[#12151b]" : "bg-[#1c2129] text-[#8b93a1] hover:text-[#c3c9d2]"
              }`}
            >
              {w}
            </button>
          ))}
        </div>
      </div>

      <div className="flex-1 overflow-y-auto px-5 pb-6">
        {status === "loading" && <LoadingBlock label={`Loading week ${week}…`} />}
        {status === "error" && <ErrorBlock label="Couldn't load this week's games." onRetry={() => load(week)} />}
        {status === "ok" && events.length === 0 && (
          <div className="text-[#6b7482] font-[Inter] text-sm py-10 text-center">No games scheduled.</div>
        )}
        {status === "ok" &&
          (() => {
            let lastDate = "";
            return events.map((e) => {
              const c = e.competitions?.[0]?.competitors ?? [];
              const away = c.find((x) => x.homeAway === "away");
              const home = c.find((x) => x.homeAway === "home");
              const isLive = e.status?.type?.state === "in";
              const isFinal = e.status?.type?.completed;
              const day = fmtDate(e.date);
              const showHeader = day !== lastDate;
              lastDate = day;
              return (
                <Fragment key={e.id}>
                  {showHeader && (
                    <div className="font-[Inter] text-[11px] uppercase tracking-[0.2em] text-[#4c5563] pt-4 pb-2 first:pt-0">{day}</div>
                  )}
                  <button
                    onClick={() => {
                      setSelected(e);
                      setSelectedId(e.id);
                    }}
                    className="w-full flex items-center justify-between py-3 border-b border-[#1a1f26] active:opacity-70 transition-opacity text-left"
                  >
                    <div className="flex items-center gap-2 flex-1 min-w-0">
                      <Logo src={away?.team?.logo} alt={away?.team?.abbreviation} size={28} />
                      <span className="font-[Inter] text-sm text-[#c3c9d2] truncate">{away?.team?.shortDisplayName}</span>
                    </div>
                    <div className="flex flex-col items-center px-3 shrink-0">
                      {isLive ? (
                        <span className="font-[Teko] text-lg text-[#FF3D2E]">{away?.score}–{home?.score}</span>
                      ) : isFinal ? (
                        <span className="font-[Teko] text-lg text-[#e8ecf1]">{away?.score}–{home?.score}</span>
                      ) : (
                        <span className="font-[JetBrains_Mono] text-[11px] text-[#6b7482]">{fmtTime(e.date)}</span>
                      )}
                    </div>
                    <div className="flex items-center gap-2 flex-1 min-w-0 justify-end">
                      <span className="font-[Inter] text-sm text-[#c3c9d2] truncate text-right">{home?.team?.shortDisplayName}</span>
                      <Logo src={home?.team?.logo} alt={home?.team?.abbreviation} size={28} />
                    </div>
                  </button>
                </Fragment>
              );
            });
          })()}
      </div>
    </div>
  );
}

/* ---------------------------- WEEKLY PICKS ---------------------------- */
/*
  A season-long, single-device game — no shared backend, nothing to sync.
  Once: choose 3 position types out of QB/RB/WR/TE/K/DEF. No drafting
  individual players — you're backing the whole position league-wide.
  Every scoring play (TD, FG, pick-6/return TD, safety) across every game
  that week gets attributed to a real player and a real position using
  ESPN's public box scores, then summed. Your score is the total for your
  3 chosen positions, shown alongside a league-wide top-scorers board.
  Recalculates itself automatically once a day (and periodically while the
  app stays open) — a manual refresh button is there too.
*/

const PICKS_KEY = "rnfl_position_pool_v1";
const POSITION_OPTIONS = [
  { key: "QB", label: "Quarterback" },
  { key: "RB", label: "Running Back" },
  { key: "WR", label: "Wide Receiver" },
  { key: "TE", label: "Tight End" },
  { key: "K", label: "Kicker" },
  { key: "DEF", label: "Defense/Special Teams" },
];

function readPicksState() {
  try {
    const raw = localStorage.getItem(PICKS_KEY);
    return raw ? JSON.parse(raw) : { positions: [], log: {}, lastAutoDate: {} };
  } catch {
    return { positions: [], log: {}, lastAutoDate: {} };
  }
}
function writePicksState(data) {
  try {
    localStorage.setItem(PICKS_KEY, JSON.stringify(data));
  } catch {}
}
function todayKey() {
  return new Date().toISOString().slice(0, 10);
}

function findStatIndex(category, name) {
  const labels = category?.labels || [];
  return labels.findIndex((l) => (l || "").toUpperCase() === name);
}
function numAt(arr, idx) {
  if (idx == null || idx < 0 || !arr) return 0;
  const raw = String(arr[idx] ?? "0").replace(/,/g, "");
  const n = parseFloat(raw);
  return Number.isFinite(n) ? n : 0;
}
function madeCountAt(arr, idx) {
  // kicking "FG" stat is usually "made/att" or "made-att"
  if (idx == null || idx < 0 || !arr) return 0;
  const raw = String(arr[idx] ?? "0");
  const made = parseInt(raw.split(/[/-]/)[0], 10);
  return Number.isFinite(made) ? made : 0;
}

function classifyPlay(play) {
  const label = `${play?.type?.text || ""} ${play?.type?.abbreviation || ""} ${play?.scoringType?.name || ""} ${
    play?.scoringType?.abbreviation || ""
  }`.toLowerCase();
  if (label.includes("safety")) return "SAFETY";
  if (label.includes("touchdown") || label.includes(" td")) return "TD";
  return null;
}
function isReturnOrSTPlay(play) {
  const text = (play.text || "").toLowerCase();
  return ["interception return", "fumble return", "punt return", "kickoff return", "blocked"].some((k) => text.includes(k));
}
function isPickSix(play) {
  return (play.text || "").toLowerCase().includes("interception return");
}

async function getScoringPlays(eventId) {
  try {
    const res = await fetch(`${BASE}/summary?event=${eventId}`);
    if (!res.ok) return null;
    const data = await res.json();
    return data.scoringPlays || (data.plays || []).filter((p) => p.scoringPlay) || [];
  } catch {
    return null;
  }
}

async function getWeekTeamScores(week, year) {
  const res = await fetch(`${BASE}/scoreboard?week=${week}&seasontype=2&year=${year}`);
  if (!res.ok) throw new Error("scoreboard failed");
  const data = await res.json();
  const scores = [];
  (data.events || []).forEach((e) => {
    const finalOrLive = e.status?.type?.state === "post" || e.status?.type?.state === "in";
    if (!finalOrLive) return;
    (e.competitions?.[0]?.competitors || []).forEach((c) => {
      const s = Number(c.score);
      if (Number.isFinite(s)) scores.push(s);
    });
  });
  return scores;
}

function teamMetaFromEvent(event, teamId) {
  const c = (event.competitions?.[0]?.competitors || []).find((c) => String(c.team?.id) === String(teamId));
  if (!c) return null;
  return { abbr: c.team.abbreviation, name: c.team.displayName, logo: c.team.logo };
}

// Scans every live/final game for the week and builds a league-wide list
// of { name, teamAbbr, teamLogo, position, points, notes } entries.
async function computeLeagueWideScoring(week, year, onProgress) {
  const res = await fetch(`${BASE}/scoreboard?week=${week}&seasontype=2&year=${year}`);
  if (!res.ok) throw new Error("couldn't load this week's games");
  const data = await res.json();
  const events = (data.events || []).filter((e) => e.status?.type?.state === "post" || e.status?.type?.state === "in");

  const map = new Map();
  const addPoints = (key, info, pts, note) => {
    if (pts <= 0) return;
    if (!map.has(key)) map.set(key, { ...info, points: 0, notes: [] });
    const entry = map.get(key);
    entry.points += pts;
    if (note) entry.notes.push(note);
  };

  let done = 0;
  for (const event of events) {
    onProgress?.(done, events.length);
    try {
      const bres = await fetch(`${BASE}/summary?event=${event.id}`);
      if (bres.ok) {
        const bdata = await bres.json();
        const teamBlocks = bdata?.boxscore?.players || [];
        for (const teamBlock of teamBlocks) {
          const teamAbbr = teamBlock.team?.abbreviation;
          const teamLogo = teamBlock.team?.logo;
          for (const cat of teamBlock.statistics || []) {
            const catName = (cat.name || "").toLowerCase();
            if (!["passing", "rushing", "receiving", "kicking"].includes(catName)) continue;
            const tdIdx = findStatIndex(cat, "TD");
            const fgIdx = findStatIndex(cat, "FG");
            for (const a of cat.athletes || []) {
              const name = a.athlete?.fullName || a.athlete?.displayName;
              if (!name) continue;
              const headshot = a.athlete?.headshot?.href;
              const explicitPos = a.athlete?.position?.abbreviation;
              const fallbackPos = catName === "passing" ? "QB" : catName === "rushing" ? "RB" : catName === "receiving" ? "WR" : "K";
              const position = explicitPos || fallbackPos;
              const key = `${teamAbbr}-${name}-${position}`;
              if (catName === "kicking") {
                const made = madeCountAt(a.stats, fgIdx);
                if (made > 0) addPoints(key, { name, teamAbbr, teamLogo, position: "K", headshot }, made * 3, `${made} FG`);
              } else {
                const tds = numAt(a.stats, tdIdx);
                if (tds > 0) addPoints(key, { name, teamAbbr, teamLogo, position, headshot }, tds * 6, `${tds} TD`);
              }
            }
          }
        }
      }
    } catch {}

    try {
      const plays = await getScoringPlays(event.id);
      if (plays) {
        for (const play of plays) {
          const cls = classifyPlay(play);
          if (!cls || !play.team?.id) continue;
          const meta = teamMetaFromEvent(event, play.team.id);
          if (!meta) continue;
          const key = `${meta.abbr}-D/ST-DEF`;
          if (cls === "SAFETY") {
            addPoints(key, { name: `${meta.name} D/ST`, teamAbbr: meta.abbr, teamLogo: meta.logo, position: "DEF" }, 2, "Safety");
          } else if (cls === "TD" && isReturnOrSTPlay(play)) {
            addPoints(
              key,
              { name: `${meta.name} D/ST`, teamAbbr: meta.abbr, teamLogo: meta.logo, position: "DEF" },
              6,
              isPickSix(play) ? "Pick-6" : "Return TD"
            );
          }
        }
      }
    } catch {}
    done++;
    onProgress?.(done, events.length);
  }

  return Array.from(map.values());
}

/* ---------------------------- SETUP ---------------------------- */

function PositionSetup({ initial, onSave }) {
  const [selected, setSelected] = useState(initial || []);
  const toggle = (key) => {
    setSelected((prev) => {
      if (prev.includes(key)) return prev.filter((k) => k !== key);
      if (prev.length >= 3) return prev;
      return [...prev, key];
    });
  };
  return (
    <div className="flex flex-col h-full">
      <div className="flex-1 flex flex-col items-center justify-center px-8 gap-4 text-center">
        <IconTrophy size={36} color="#F2A93B" />
        <h2 className="font-[Teko] text-4xl text-[#e8ecf1] leading-none">Weekly Picks</h2>
        <p className="font-[Inter] text-sm text-[#6b7482] max-w-xs">
          Choose exactly 3 positions. Your score is the combined league-wide total for everyone who plays those positions
          — no individual drafting.
        </p>
        <div className="w-full max-w-xs grid grid-cols-2 gap-2 mt-2">
          {POSITION_OPTIONS.map((p) => {
            const active = selected.includes(p.key);
            return (
              <button
                key={p.key}
                onClick={() => toggle(p.key)}
                className={`py-3 rounded-xl font-[Inter] text-sm font-medium transition-colors ${
                  active ? "bg-[#F2A93B] text-[#12151b]" : "bg-[#1c2129] text-[#c3c9d2]"
                }`}
              >
                {p.label}
              </button>
            );
          })}
        </div>
        <button
          onClick={() => onSave(selected)}
          disabled={selected.length !== 3}
          className="mt-4 w-full max-w-xs py-3 rounded-xl bg-[#F2A93B] text-[#12151b] font-[Inter] text-sm font-semibold tracking-wide disabled:opacity-40 active:scale-[0.98] transition-transform"
        >
          {selected.length}/3 selected — Continue
        </button>
      </div>
    </div>
  );
}

/* ---------------------------- DASHBOARD ---------------------------- */

function Headshot({ src, alt, name, size = 40 }) {
  const [broken, setBroken] = useState(false);
  const initials = (name || "?").split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  if (!src || broken) {
    return (
      <div
        style={{ width: size, height: size }}
        className="rounded-lg bg-[#1c2129] flex items-center justify-center text-[#5a6472] font-[Teko] text-base shrink-0"
      >
        {initials || "?"}
      </div>
    );
  }
  return (
    <img
      src={src}
      alt={alt}
      onError={() => setBroken(true)}
      style={{ width: size, height: size }}
      className="rounded-lg object-cover bg-[#1c2129] shrink-0"
    />
  );
}

function WeeklyPicksDashboard() {
  const [state, setState] = useState(() => readPicksState());
  const [week, setWeek] = useState(null);
  const [calcStatus, setCalcStatus] = useState("idle"); // idle | working | error
  const [calcError, setCalcError] = useState("");
  const [progress, setProgress] = useState(null);
  const [expandedWeek, setExpandedWeek] = useState(null);
  const year = new Date().getFullYear();

  useEffect(() => {
    fetch(`${BASE}/scoreboard`)
      .then((r) => r.json())
      .then((d) => setWeek(d?.week?.number ?? 1))
      .catch(() => setWeek(1));
  }, []);

  const calculateWeek = useCallback(async () => {
    if (!week) return;
    setCalcStatus("working");
    setCalcError("");
    setProgress(null);
    try {
      const entries = await computeLeagueWideScoring(week, year, (done, total) => setProgress({ done, total }));
      const yourScore = Math.round(entries.filter((e) => state.positions.includes(e.position)).reduce((s, e) => s + e.points, 0) * 10) / 10;
      const topScorers = [...entries].sort((a, b) => b.points - a.points).slice(0, 15);
      const teamScores = await getWeekTeamScores(week, year);
      const beatCount = teamScores.filter((s) => yourScore > s).length;
      const totalTeams = teamScores.length;
      const passed = totalTeams > 0 ? beatCount > totalTeams / 2 : null;

      const next = {
        ...state,
        log: {
          ...state.log,
          [week]: { total: yourScore, topScorers, beatCount, totalTeams, passed, computedAt: Date.now() },
        },
        lastAutoDate: { ...state.lastAutoDate, [week]: todayKey() },
      };
      setState(next);
      writePicksState(next);
      setCalcStatus("idle");
    } catch (e) {
      setCalcStatus("error");
      setCalcError(e.message || "Something went wrong");
    } finally {
      setProgress(null);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [week, state.positions, year]);

  // auto-recalculate once per day for the current week
  useEffect(() => {
    if (!week || state.positions.length !== 3) return;
    if (state.lastAutoDate[week] === todayKey()) return;
    calculateWeek();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [week, state.positions.length]);

  // gentle periodic refresh while the app stays open, for live-game days
  useEffect(() => {
    const id = setInterval(() => {
      if (week && state.positions.length === 3) calculateWeek();
    }, 3 * 60 * 60 * 1000);
    return () => clearInterval(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [week, state.positions]);

  if (state.positions.length !== 3) {
    return (
      <PositionSetup
        initial={state.positions}
        onSave={(positions) => {
          const next = { ...state, positions };
          setState(next);
          writePicksState(next);
        }}
      />
    );
  }

  const weekNumbers = Object.keys(state.log).map(Number).sort((a, b) => b - a);
  const current = state.log[week];
  const passedCount = weekNumbers.filter((w) => state.log[w].passed).length;

  return (
    <div className="flex flex-col h-full">
      <div className="flex-1 overflow-y-auto px-5 pt-6 pb-8">
        <div className="flex items-center justify-between">
          <h2 className="font-[Teko] text-4xl text-[#e8ecf1] leading-none">Weekly Picks</h2>
          <button
            onClick={() => {
              const next = { ...state, positions: [] };
              setState(next);
              writePicksState(next);
            }}
            className="font-[Inter] text-[11px] text-[#6b7482] underline underline-offset-2"
          >
            Change positions
          </button>
        </div>
        <div className="mt-1 font-[Inter] text-xs text-[#6b7482]">
          {passedCount} of {weekNumbers.length} weeks beaten half the league
        </div>

        <div className="mt-4 flex gap-2">
          {state.positions.map((pos) => (
            <span key={pos} className="px-3 py-1.5 rounded-full bg-[#1c2129] text-[#F2A93B] font-[Inter] text-xs font-semibold">
              {POSITION_OPTIONS.find((o) => o.key === pos)?.label}
            </span>
          ))}
        </div>

        <div className="mt-5 rounded-xl bg-[#14181d] p-4 flex items-center justify-between">
          <div>
            <div className="font-[Inter] text-[11px] uppercase tracking-[0.2em] text-[#4c5563]">Week {week ?? "—"} Score</div>
            <div className="font-[Teko] text-5xl text-[#e8ecf1] leading-none mt-1">{current ? current.total : "—"}</div>
          </div>
          {current?.passed != null && (
            <span
              className={`text-xs font-[Inter] font-semibold px-2.5 py-1 rounded-full ${
                current.passed ? "bg-[#1f3a24] text-[#7fd88f]" : "bg-[#3a1f1f] text-[#e08a8a]"
              }`}
            >
              {current.passed ? "PASSED" : "MISSED"}
            </span>
          )}
        </div>
        {current && (
          <div className="mt-1.5 font-[Inter] text-[11px] text-[#6b7482]">
            Beat {current.beatCount} of {current.totalTeams} teams this week
          </div>
        )}

        <div className="mt-4">
          <button
            onClick={calculateWeek}
            disabled={calcStatus === "working" || !week}
            className="w-full py-3.5 rounded-xl bg-[#F2A93B] text-[#12151b] font-[Inter] text-sm font-semibold tracking-wide disabled:opacity-40 active:scale-[0.98] transition-transform flex items-center justify-center gap-2"
          >
            {calcStatus === "working" ? <Spinner size={16} /> : null}
            {calcStatus === "working"
              ? progress
                ? `Crunching stats… (${progress.done}/${progress.total} games)`
                : "Crunching league-wide stats…"
              : `Refresh Week ${week ?? ""} Score`}
          </button>
          {calcStatus === "error" && <div className="mt-2 font-[Inter] text-xs text-[#FF3D2E] text-center">{calcError}</div>}
          <div className="mt-2 font-[Inter] text-[11px] text-[#4c5563] text-center">
            Updates itself once a day · TD 6 · FG 3 · Pick-6 6 · Safety 2
          </div>
        </div>

        {current?.topScorers?.length > 0 && (
          <div className="mt-7">
            <div className="font-[Inter] text-[11px] uppercase tracking-[0.2em] text-[#4c5563] mb-2">Top Scorers This Week</div>
            <div className="rounded-xl overflow-hidden bg-[#14181d]">
              {current.topScorers.map((p, i) => (
                <div
                  key={`${p.teamAbbr}-${p.name}`}
                  className={`flex items-center gap-3 px-3.5 py-2.5 ${
                    i !== current.topScorers.length - 1 ? "border-b border-[#1a1f26]" : ""
                  } ${state.positions.includes(p.position) ? "bg-[#191d10]" : ""}`}
                >
                  <span className="font-[Teko] text-lg text-[#4c5563] w-5 text-center shrink-0">{i + 1}</span>
                  <Headshot src={p.headshot} alt={p.name} name={p.name} size={34} />
                  <div className="flex-1 min-w-0">
                    <div className="font-[Inter] text-sm text-[#e8ecf1] truncate">{p.name}</div>
                    <div className="font-[JetBrains_Mono] text-[10px] text-[#6b7482]">
                      {p.teamAbbr} · {p.position} · {p.notes.join(", ")}
                    </div>
                  </div>
                  <span className="font-[Teko] text-lg text-[#F2A93B] shrink-0">{p.points}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {weekNumbers.length > 0 && (
          <div className="mt-7">
            <div className="font-[Inter] text-[11px] uppercase tracking-[0.2em] text-[#4c5563] mb-2">Season Log</div>
            <div className="rounded-xl overflow-hidden bg-[#14181d]">
              {weekNumbers.map((w, i) => {
                const entry = state.log[w];
                const isOpen = expandedWeek === w;
                return (
                  <div key={w} className={i !== weekNumbers.length - 1 ? "border-b border-[#1a1f26]" : ""}>
                    <button
                      onClick={() => setExpandedWeek(isOpen ? null : w)}
                      className="w-full flex items-center justify-between px-3.5 py-3 active:bg-[#1c2129] transition-colors"
                    >
                      <div className="flex items-center gap-2">
                        <span className="font-[Inter] text-sm text-[#e8ecf1]">Week {w}</span>
                        {entry.passed != null && (
                          <span
                            className={`text-[10px] font-[Inter] font-semibold px-1.5 py-0.5 rounded ${
                              entry.passed ? "bg-[#1f3a24] text-[#7fd88f]" : "bg-[#3a1f1f] text-[#e08a8a]"
                            }`}
                          >
                            {entry.passed ? "PASSED" : "MISSED"}
                          </span>
                        )}
                      </div>
                      <span className="font-[Teko] text-lg text-[#F2A93B]">{entry.total} pts</span>
                    </button>
                    {isOpen && (
                      <div className="px-3.5 pb-3 flex flex-col gap-1.5">
                        <div className="font-[Inter] text-[11px] text-[#6b7482] mb-1">
                          Beat {entry.beatCount} of {entry.totalTeams} teams that week
                        </div>
                        {entry.topScorers.slice(0, 5).map((p) => (
                          <div key={`${p.teamAbbr}-${p.name}`} className="flex items-center justify-between gap-2">
                            <div className="min-w-0">
                              <div className="font-[Inter] text-xs text-[#c3c9d2] truncate">
                                {p.name} <span className="text-[#4c5563]">· {p.position}</span>
                              </div>
                            </div>
                            <span className="font-[JetBrains_Mono] text-xs text-[#e8ecf1] shrink-0">{p.points}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------------------- APP SHELL ---------------------------- */

function App() {
  const [tab, setTab] = useState("home");

  return (
    <div className="w-full h-[100dvh] max-w-md mx-auto bg-[#0d0f13] flex flex-col overflow-hidden relative">
      <div className="flex items-center justify-between px-5 pt-5 pb-2 border-b border-[#1a1f26]">
        <div className="flex items-center gap-2">
          <span className="w-2 h-2 rounded-full bg-[#FF3D2E]" />
          <h1 className="font-[Teko] text-2xl tracking-[0.08em] text-[#e8ecf1]">RNFL</h1>
        </div>
        <span className="font-[JetBrains_Mono] text-[10px] text-[#4c5563] uppercase tracking-widest">{new Date().getFullYear()} Season</span>
      </div>

      <div className="flex-1 min-h-0">
        {tab === "home" && <Home />}
        {tab === "games" && <Games />}
        {tab === "squad" && <WeeklyPicksDashboard />}
      </div>

      <div className="flex items-stretch border-t border-[#1a1f26] bg-[#0d0f13]">
        {[
          { key: "home", label: "Home", Icon: IconHome },
          { key: "games", label: "Games", Icon: IconCalendar },
          { key: "squad", label: "Weekly Picks", Icon: IconTrophy },
        ].map(({ key, label, Icon }) => (
          <button key={key} onClick={() => setTab(key)} className="flex-1 flex flex-col items-center gap-1 py-2.5">
            <Icon size={20} color={tab === key ? "#F2A93B" : "#5a6472"} />
            <span className={`font-[Inter] text-[10px] tracking-wide ${tab === key ? "text-[#F2A93B] font-semibold" : "text-[#5a6472]"}`}>{label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

root.render(<App />);
</script>
